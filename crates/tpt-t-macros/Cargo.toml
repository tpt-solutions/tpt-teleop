[package]
name = "tpt-t-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Ergonomic proc-macro scaffolding for tpt-teleop robots: #[derive(Robot)] with #[robot]/#[camera]/#[motor] codegen"
readme = "README.md"
keywords = ["proc-macro", "robot", "derive", "codegen", "teleoperation"]
categories = ["development-tools::procedural-macro-helpers", "science::robotics"]

[lib]
name = "tpt_t"
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
tpt-t-core = { workspace = true }
tpt-t-ring = { workspace = true }
rkyv = { workspace = true, features = ["bytecheck"] }

[lints]
workspace = true
