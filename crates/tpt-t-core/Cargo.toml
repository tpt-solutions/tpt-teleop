[package]
name = "tpt-t-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Central state machine, lock-free message bus, platform event loops, thread pinning, and zero-copy wire types for tpt-teleop"
readme = "README.md"
keywords = ["teleoperation", "lock-free", "zero-copy", "event-loop", "realtime"]
categories = ["concurrency", "science::robotics", "os"]

[dependencies]
tpt-t-ring = { workspace = true }
rkyv = { workspace = true, features = ["bytecheck"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "bus_bench"
harness = false
