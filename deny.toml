# cargo-deny configuration — the "MIT Chain" policy (spec §2)
#
# tpt-teleop keeps its dependency tree free of Apache-only patent liabilities:
#   * Allowed: MIT, BSD-2/3-Clause, ISC, Zlib, MPL-2.0 (and Unicode font/data
#     licenses for embedded Unicode tables, which are BSD-style permissive).
#   * Dual MIT OR Apache-2.0 crates are permitted, but cargo resolves and
#     compiles them strictly under MIT via the [[licenses.clarify]] overrides
#     below. New dual-licensed transitive deps MUST be added here.
#   * Strictly Apache-2.0-only crates are banned outright.

[graph]
all-features = true
# Check every CI target from one invocation so platform-gated deps
# (windows-sys, io-uring, libc) are always audited.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    # BSD-style permissive licenses used solely for embedded Unicode tables
    "Unicode-DFS-2016",
    "Unicode-3.0",
]
confidence-threshold = 0.93

# --- Banned licenses -------------------------------------------------------
# cargo-deny 0.20+ denies every license NOT listed in `allow` below, so
# strictly-Apache-2.0-only crates are banned automatically. Dual
# MIT OR Apache-2.0 crates resolve to their MIT branch (MIT is allowed) and
# pass, so the Apache-2.0 grant is never relied upon.

# `ring`'s (ISC) build script pulls this dual MIT/Apache-2.0 crate; force MIT
# so the Apache-2.0 grant is never relied upon.
[bans]
multiple-versions = "warn"
# `deny` would flag every `{ workspace = true }` internal dependency as a
# wildcard (cargo-deny 0.20 treats inherited versions as unspecified), so we
# warn instead — external crates still must not use `*` version specs, which
# `cargo` itself already rejects for published manifests.
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
# A yanked crate can silently pull a compromised version; fail the audit rather
# than warn. Severity threshold set so any real vulnerability fails CI.
yanked = "deny"
severity = "medium"
ignore = []
