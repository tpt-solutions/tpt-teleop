[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-teleop"
homepage = "https://tpt.solutions/tpt-teleop"
documentation = "https://docs.rs/tpt-t-core"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
# Internal crates
tpt-t-core = { path = "crates/tpt-t-core" }
tpt-t-ring = { path = "crates/tpt-t-ring" }
tpt-t-hal = { path = "crates/tpt-t-hal" }
tpt-t-safety = { path = "crates/tpt-t-safety" }
tpt-t-input = { path = "crates/tpt-t-input" }
tpt-t-media = { path = "crates/tpt-t-media" }
tpt-t-link = { path = "crates/tpt-t-link" }
tpt-t-cloud = { path = "crates/tpt-t-cloud" }
tpt-t-sec = { path = "crates/tpt-t-sec" }
tpt-t-analytics = { path = "crates/tpt-t-analytics" }

# Platform (all dual MIT OR Apache-2.0 — see deny.toml MIT-chain policy).
# Members gate these behind [target.'cfg(...)'.dependencies] as needed;
# deny.toml audits them on every CI target regardless of host OS.
libc = "0.2"
io-uring = "0.7"
rkyv = { version = "0.8", features = ["bytecheck"] }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

[profile.bench]
inherits = "release"
