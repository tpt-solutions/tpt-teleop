name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (workspace)
        run: cargo build --workspace --all-targets
      - name: Test (workspace)
        run: cargo test --workspace

  cross-check:
    # Compile-check every cfg-gated backend (io_uring / kqueue / IOCP)
    # regardless of host OS.
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check (${{ matrix.target }})
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}

  integration:
    # Phase 14, item 4: full cross-platform integration suite against the Phase
    # 4 simulator, plus the zero-lock hot-path audit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Integration suite (Phase 14)
        run: cargo test -p tpt-t-integration
      - name: Zero-lock hot-path audit
        run: bash tools/lock-audit.sh
